<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FFT Spectrum Analyzer</title>
        <script src="https://cdn.plot.ly/plotly-2.29.1.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --bg-primary: #ffffff;
                --bg-secondary: #f8f9fa;
                --bg-tertiary: #e9ecef;
                --text-primary: #212529;
                --text-secondary: #6c757d;
                --border-color: #dee2e6;
                --accent-blue: #0d6efd;
                --accent-green: #198754;
                --accent-orange: #fd7e14;
                --accent-red: #dc3545;
                --accent-purple: #6f42c1;
                --plot-bg: #ffffff;
                --plot-grid: #e9ecef;
                --shadow: rgba(0, 0, 0, 0.1);
            }

            [data-theme="dark"] {
                --bg-primary: #0a0e27;
                --bg-secondary: #0f1423;
                --bg-tertiary: #1a1f3a;
                --text-primary: #e9ecef;
                --text-secondary: #9e9e9e;
                --border-color: #2a3f5f;
                --accent-blue: #4fc3f7;
                --accent-green: #4caf50;
                --accent-orange: #ff9800;
                --accent-red: #f44336;
                --accent-purple: #9c27b0;
                --plot-bg: #0f1423;
                --plot-grid: #2a3f5f;
                --shadow: rgba(0, 0, 0, 0.5);
            }

            html,
            body {
                width: 100%;
                height: 100%;
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Oxygen, Ubuntu, sans-serif;
                background: var(--bg-primary);
                color: var(--text-primary);
                transition:
                    background-color 0.3s,
                    color 0.3s;
            }

            #app {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            #header {
                padding: 16px 24px;
                background: var(--bg-secondary);
                border-bottom: 2px solid var(--border-color);
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-shrink: 0;
            }

            #header h1 {
                font-size: 20px;
                font-weight: 600;
                color: var(--accent-blue);
            }

            #controls {
                display: flex;
                gap: 12px;
                align-items: center;
            }

            .sample-rate-input {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 13px;
            }

            .sample-rate-input input {
                width: 80px;
                padding: 6px 10px;
                border: 1px solid var(--border-color);
                background: var(--bg-tertiary);
                color: var(--text-primary);
                border-radius: 4px;
                font-size: 13px;
                font-family: "Courier New", monospace;
            }

            .sample-rate-input label {
                color: var(--text-secondary);
                font-weight: 500;
            }

            .btn {
                padding: 8px 16px;
                border: 1px solid var(--border-color);
                background: var(--bg-tertiary);
                color: var(--text-primary);
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                transition: all 0.2s;
            }

            .btn:hover {
                background: var(--bg-primary);
                border-color: var(--accent-blue);
            }

            .btn-primary {
                background: var(--accent-blue);
                color: white;
                border-color: var(--accent-blue);
            }

            .btn-primary:hover {
                opacity: 0.9;
            }

            .btn-toggle {
                background: var(--accent-purple);
                color: white;
                border-color: var(--accent-purple);
            }

            .btn-toggle:hover {
                opacity: 0.9;
            }

            .btn-toggle.active {
                background: var(--accent-green);
                border-color: var(--accent-green);
            }

            #theme-toggle {
                background: none;
                border: none;
                cursor: pointer;
                font-size: 20px;
                padding: 8px;
                transition: transform 0.2s;
            }

            #theme-toggle:hover {
                transform: scale(1.1);
            }

            #main-content {
                display: flex;
                flex: 1;
                overflow: hidden;
            }

            #drop-zone-container {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px;
            }

            #drop-zone {
                width: 100%;
                max-width: 600px;
                padding: 60px 40px;
                border: 3px dashed var(--border-color);
                border-radius: 12px;
                text-align: center;
                background: var(--bg-secondary);
                transition: all 0.3s;
                cursor: pointer;
            }

            #drop-zone:hover,
            #drop-zone.drag-over {
                border-color: var(--accent-blue);
                background: var(--bg-tertiary);
            }

            #drop-zone-icon {
                font-size: 48px;
                margin-bottom: 16px;
            }

            #drop-zone-text {
                font-size: 18px;
                font-weight: 500;
                margin-bottom: 8px;
                color: var(--text-primary);
            }

            #drop-zone-subtext {
                font-size: 14px;
                color: var(--text-secondary);
            }

            #viewer-container {
                display: none;
                flex: 1;
            }

            #viewer-container.active {
                display: flex;
            }

            #sidebar {
                width: 340px;
                background: var(--bg-secondary);
                border-right: 2px solid var(--border-color);
                overflow-y: auto;
                flex-shrink: 0;
            }

            #sidebar-content {
                padding: 20px;
            }

            .info-section {
                margin-bottom: 24px;
            }

            .section-title {
                font-size: 14px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: var(--text-secondary);
                margin-bottom: 12px;
                padding-bottom: 8px;
                border-bottom: 2px solid var(--border-color);
            }

            .metric-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .metric-card {
                background: var(--bg-tertiary);
                padding: 12px;
                border-radius: 8px;
                border-left: 3px solid var(--accent-blue);
            }

            .metric-label {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                color: var(--text-secondary);
                margin-bottom: 4px;
            }

            .metric-value {
                font-size: 18px;
                font-weight: 700;
                color: var(--text-primary);
                font-family: "Courier New", monospace;
            }

            .metric-unit {
                font-size: 12px;
                color: var(--text-secondary);
                margin-left: 4px;
            }

            .component {
                background: var(--bg-tertiary);
                padding: 12px;
                margin: 8px 0;
                border-radius: 8px;
                border-left: 4px solid;
            }

            .component.dc {
                border-left-color: var(--accent-orange);
            }
            .component.carrier {
                border-left-color: var(--accent-green);
            }
            .component.hd {
                border-left-color: var(--accent-red);
            }
            .component.spur {
                border-left-color: var(--accent-purple);
            }

            .component-header {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                margin-bottom: 8px;
            }

            .component-name {
                font-weight: 600;
                font-size: 14px;
            }

            .component-amp {
                font-size: 13px;
                font-weight: 700;
                font-family: "Courier New", monospace;
            }

            .component-details {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 4px 12px;
                font-size: 12px;
                color: var(--text-secondary);
            }

            .component-details .label {
                font-weight: 500;
            }

            .component-details .value {
                text-align: right;
                font-family: "Courier New", monospace;
            }

            #plot-container {
                flex: 1;
                background: var(--bg-primary);
                position: relative;
            }

            #plot {
                width: 100%;
                height: 100%;
            }

            .loading {
                text-align: center;
                padding: 40px;
                color: var(--text-secondary);
                font-size: 14px;
            }

            .error {
                color: var(--accent-red);
                padding: 12px;
                background: var(--bg-tertiary);
                border-radius: 6px;
                border-left: 4px solid var(--accent-red);
                margin: 8px 0;
                font-size: 13px;
            }

            .warning {
                color: var(--accent-orange);
                padding: 12px;
                background: var(--bg-tertiary);
                border-radius: 6px;
                border-left: 4px solid var(--accent-orange);
                margin: 8px 0;
                font-size: 13px;
            }

            #file-input {
                display: none;
            }

            @media (max-width: 1024px) {
                #sidebar {
                    width: 280px;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="header">
                <h1>🔬 FFT Spectrum Analyzer</h1>
                <div id="controls">
                    <div class="sample-rate-input">
                        <label for="sample-rate">Fs:</label>
                        <input
                            type="number"
                            id="sample-rate"
                            value="1500"
                            step="0.1"
                        />
                        <span style="color: var(--text-secondary)">MHz</span>
                    </div>
                    <div class="sample-rate-input">
                        <label for="decimation">Decim:</label>
                        <input
                            type="number"
                            id="decimation"
                            value="4"
                            step="1"
                            min="1"
                        />
                    </div>
                    <div class="sample-rate-input">
                        <label for="carrier-freq">Carrier:</label>
                        <input
                            type="number"
                            id="carrier-freq"
                            value="100"
                            step="0.1"
                        />
                        <span style="color: var(--text-secondary)">MHz</span>
                    </div>
                    <button
                        id="view-toggle"
                        class="btn btn-toggle"
                        style="display: none"
                    >
                        View Samples
                    </button>
                    <button
                        id="load-another-btn"
                        class="btn btn-primary"
                        style="display: none"
                    >
                        Load Another File
                    </button>
                    <button id="theme-toggle" title="Toggle theme">🌓</button>
                </div>
            </div>

            <div id="main-content">
                <div id="drop-zone-container">
                    <div id="drop-zone">
                        <div id="drop-zone-icon">📊</div>
                        <div id="drop-zone-text">
                            Drop NPY samples file here
                        </div>
                        <div id="drop-zone-subtext">or click to browse</div>
                    </div>
                </div>

                <div id="viewer-container">
                    <div id="sidebar">
                        <div id="sidebar-content" class="loading">
                            Loading...
                        </div>
                    </div>
                    <div id="plot-container">
                        <div id="plot"></div>
                    </div>
                </div>
            </div>
        </div>

        <input type="file" id="file-input" accept=".npy" />

        <script type="module">
            // Theme Management
            const themeToggle = document.getElementById("theme-toggle");
            const sampleRateInput = document.getElementById("sample-rate");
            const decimationInput = document.getElementById("decimation");
            const carrierFreqInput = document.getElementById("carrier-freq");
            const viewToggle = document.getElementById("view-toggle");
            const html = document.documentElement;

            const savedTheme = localStorage.getItem("theme") || "light";
            html.setAttribute("data-theme", savedTheme);

            themeToggle.addEventListener("click", () => {
                const currentTheme = html.getAttribute("data-theme");
                const newTheme = currentTheme === "light" ? "dark" : "light";
                html.setAttribute("data-theme", newTheme);
                localStorage.setItem("theme", newTheme);

                // Re-render plot if it exists
                if (window.plotData) {
                    if (window.currentView === "samples") {
                        updateSamplesPlot();
                    } else {
                        updatePlot();
                    }
                }
            });

            // View toggle
            viewToggle.addEventListener("click", () => {
                if (window.currentView === "fft") {
                    window.currentView = "samples";
                    viewToggle.textContent = "View FFT";
                    viewToggle.classList.add("active");
                    updateSamplesPlot();
                } else {
                    window.currentView = "fft";
                    viewToggle.textContent = "View Samples";
                    viewToggle.classList.remove("active");
                    updatePlot();
                }
            });

            // Re-render when carrier frequency changes
            carrierFreqInput.addEventListener("change", () => {
                if (window.plotData && window.currentView === "samples") {
                    updateSamplesPlot();
                }
            });

            function recomputeFrequencyAxis() {
                if (window.plotData) {
                    const fs = parseFloat(sampleRateInput.value) * 1e6; // Convert MHz to Hz
                    const decimation = parseFloat(decimationInput.value);
                    const effectiveFs = fs / decimation;
                    const N = window.plotData.N;
                    const mag_dB = window.plotData.mag_dB;

                    // Recompute frequency axis with decimation
                    const freqs = new Float32Array(N);
                    for (let k = 0; k < N; k++) {
                        if (k < N / 2) {
                            freqs[k] = k * (effectiveFs / N);
                        } else {
                            freqs[k] = (k - N) * (effectiveFs / N);
                        }
                    }

                    // Apply fftshift
                    const half = Math.floor(N / 2);
                    const x = [
                        ...Array.from(freqs.slice(half)),
                        ...Array.from(freqs.slice(0, half)),
                    ];

                    window.plotData.x = x;
                    window.plotData.fs = effectiveFs;

                    if (window.currentView === "fft") {
                        updatePlot();
                    }
                }
            }

            sampleRateInput.addEventListener("change", recomputeFrequencyAxis);
            decimationInput.addEventListener("change", recomputeFrequencyAxis);

            // NPY Parser
            class NPYParser {
                static async parse(arrayBuffer) {
                    const view = new DataView(arrayBuffer);

                    // Check magic number
                    const magic = String.fromCharCode(
                        view.getUint8(0),
                        view.getUint8(1),
                        view.getUint8(2),
                        view.getUint8(3),
                        view.getUint8(4),
                        view.getUint8(5),
                    );
                    if (magic !== "\x93NUMPY") {
                        throw new Error(
                            "Invalid NPY file: magic number mismatch",
                        );
                    }

                    const version = {
                        major: view.getUint8(6),
                        minor: view.getUint8(7),
                    };

                    let headerLen;
                    if (version.major === 1) {
                        headerLen = view.getUint16(8, true);
                    } else if (version.major === 2 || version.major === 3) {
                        headerLen = view.getUint32(8, true);
                    } else {
                        throw new Error("Unsupported NPY version");
                    }

                    const headerOffset = version.major === 1 ? 10 : 12;
                    const headerBytes = new Uint8Array(
                        arrayBuffer,
                        headerOffset,
                        headerLen,
                    );
                    const headerStr = new TextDecoder().decode(headerBytes);

                    // Parse header
                    const header = this.parseHeader(headerStr);

                    const dataOffset = headerOffset + headerLen;
                    const dataBytes = arrayBuffer.byteLength - dataOffset;

                    return this.parseData(
                        arrayBuffer,
                        dataOffset,
                        dataBytes,
                        header,
                    );
                }

                static parseHeader(headerStr) {
                    // Remove trailing whitespace and newlines
                    headerStr = headerStr.trim();

                    // Extract descr, fortran_order, and shape
                    const descrMatch = headerStr.match(/'descr':\s*'([^']+)'/);
                    const fortranMatch = headerStr.match(
                        /'fortran_order':\s*(True|False)/,
                    );
                    const shapeMatch = headerStr.match(
                        /'shape':\s*\(([^)]*)\)/,
                    );

                    if (!descrMatch || !fortranMatch || !shapeMatch) {
                        throw new Error("Invalid NPY header format");
                    }

                    const descr = descrMatch[1];
                    const fortranOrder = fortranMatch[1] === "True";
                    const shapeStr = shapeMatch[1].trim();
                    const shape = shapeStr
                        ? shapeStr
                              .split(",")
                              .map((s) => parseInt(s.trim()))
                              .filter((n) => !isNaN(n))
                        : [];

                    return { descr, fortranOrder, shape };
                }

                static parseData(arrayBuffer, offset, length, header) {
                    const { descr, shape } = header;

                    // Parse dtype
                    const isComplex = descr.includes("c");
                    const byteOrder = descr[0]; // '<' = little-endian, '>' = big-endian
                    const littleEndian = byteOrder === "<" || byteOrder === "|";

                    let baseType, byteSize;
                    if (isComplex) {
                        // Complex type: c8 = complex64, c16 = complex128
                        const match = descr.match(/c(\d+)/);
                        byteSize = parseInt(match[1]);
                        baseType = byteSize === 8 ? "float32" : "float64";
                    } else {
                        // Real type
                        const match = descr.match(/([fi])(\d+)/);
                        if (!match)
                            throw new Error("Unsupported dtype: " + descr);
                        const typeChar = match[1];
                        byteSize = parseInt(match[2]);
                        baseType =
                            typeChar === "f"
                                ? byteSize === 4
                                    ? "float32"
                                    : "float64"
                                : byteSize === 4
                                  ? "int32"
                                  : "int64";
                    }

                    const numElements = shape.reduce((a, b) => a * b, 1);
                    const view = new DataView(arrayBuffer, offset);

                    if (isComplex) {
                        const componentSize = byteSize / 2;
                        const real =
                            componentSize === 4
                                ? new Float32Array(numElements)
                                : new Float64Array(numElements);
                        const imag =
                            componentSize === 4
                                ? new Float32Array(numElements)
                                : new Float64Array(numElements);

                        for (let i = 0; i < numElements; i++) {
                            const byteOffset = i * byteSize;
                            if (componentSize === 4) {
                                real[i] = view.getFloat32(
                                    byteOffset,
                                    littleEndian,
                                );
                                imag[i] = view.getFloat32(
                                    byteOffset + 4,
                                    littleEndian,
                                );
                            } else {
                                real[i] = view.getFloat64(
                                    byteOffset,
                                    littleEndian,
                                );
                                imag[i] = view.getFloat64(
                                    byteOffset + 8,
                                    littleEndian,
                                );
                            }
                        }

                        return { real, imag, shape, isComplex: true };
                    } else {
                        let data;
                        if (baseType === "float32") {
                            data = new Float32Array(numElements);
                            for (let i = 0; i < numElements; i++) {
                                data[i] = view.getFloat32(i * 4, littleEndian);
                            }
                        } else if (baseType === "float64") {
                            data = new Float64Array(numElements);
                            for (let i = 0; i < numElements; i++) {
                                data[i] = view.getFloat64(i * 8, littleEndian);
                            }
                        } else {
                            throw new Error("Unsupported type: " + baseType);
                        }

                        return {
                            real: data,
                            imag: new Float32Array(numElements),
                            shape,
                            isComplex: false,
                        };
                    }
                }
            }

            // FFT Computation
            function computeFFT(real, imag) {
                const N = real.length;
                const complexArray = [];
                for (let i = 0; i < N; i++) {
                    complexArray.push(math.complex(real[i], imag[i]));
                }

                const result = math.fft(complexArray);
                const outReal = new Float32Array(N);
                const outImag = new Float32Array(N);

                for (let i = 0; i < N; i++) {
                    outReal[i] = result[i].re;
                    outImag[i] = result[i].im;
                }

                return { real: outReal, imag: outImag };
            }

            // Phase unwrapping function based on the Python implementation
            function unwrapCarrierPhase(
                samples,
                coherentCarrierFreq,
                samplingRate,
            ) {
                const cohLen = samples.length;
                const fbin = (coherentCarrierFreq / samplingRate) * cohLen;

                // Create index array
                const idx = new Array(cohLen);
                for (let i = 0; i < cohLen; i++) {
                    idx[i] = Math.floor((fbin * i) % cohLen);
                }

                // Create unwrapped samples
                const unwrappedSamples = new Float32Array(cohLen);
                for (let i = 0; i < cohLen; i++) {
                    unwrappedSamples[idx[i]] = samples[i];
                }

                return unwrappedSamples;
            }

            // Load file from URL
            async function loadFileFromURL(url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(
                            `Failed to fetch file: ${response.statusText}`,
                        );
                    }
                    const arrayBuffer = await response.arrayBuffer();
                    return arrayBuffer;
                } catch (error) {
                    console.error("Error loading file from URL:", error);
                    throw error;
                }
            }

            // File handling
            let currentFile = null;
            window.plotData = null;
            window.currentView = "fft"; // Default view is FFT

            const dropZone = document.getElementById("drop-zone");
            const dropZoneContainer = document.getElementById(
                "drop-zone-container",
            );
            const viewerContainer = document.getElementById("viewer-container");
            const fileInput = document.getElementById("file-input");
            const loadAnotherBtn = document.getElementById("load-another-btn");

            dropZone.addEventListener("click", () => fileInput.click());

            dropZone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropZone.classList.add("drag-over");
            });

            dropZone.addEventListener("dragleave", () => {
                dropZone.classList.remove("drag-over");
            });

            dropZone.addEventListener("drop", async (e) => {
                e.preventDefault();
                dropZone.classList.remove("drag-over");

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    await processFile(files[0]);
                }
            });

            fileInput.addEventListener("change", async (e) => {
                if (e.target.files.length > 0) {
                    await processFile(e.target.files[0]);
                }
            });

            loadAnotherBtn.addEventListener("click", () => {
                dropZoneContainer.style.display = "flex";
                viewerContainer.classList.remove("active");
                loadAnotherBtn.style.display = "none";
                viewToggle.style.display = "none";
                currentFile = null;
                window.plotData = null;
            });

            async function processFile(fileOrPath, isURL = false) {
                let filename;
                let arrayBuffer;

                if (isURL) {
                    filename = fileOrPath.split("/").pop();
                    try {
                        arrayBuffer = await loadFileFromURL(fileOrPath);
                    } catch (error) {
                        document.getElementById("sidebar-content").innerHTML =
                            `<div class="error"><strong>Error loading file:</strong> ${error.message}</div>`;
                        return;
                    }
                } else {
                    if (!fileOrPath.name.endsWith(".npy")) {
                        alert("Please select a .npy file");
                        return;
                    }

                    if (!fileOrPath.name.includes("samples")) {
                        alert(
                            'Please select a samples NPY file (filename should contain "samples")',
                        );
                        return;
                    }

                    filename = fileOrPath.name;
                    arrayBuffer = await fileOrPath.arrayBuffer();
                }

                currentFile = fileOrPath;

                // Show viewer, hide drop zone
                dropZoneContainer.style.display = "none";
                viewerContainer.classList.add("active");
                loadAnotherBtn.style.display = "block";
                viewToggle.style.display = "block";

                document.getElementById("sidebar-content").innerHTML =
                    '<div class="loading">Loading and computing FFT...</div>';

                try {
                    // Parse NPY
                    const npyData = await NPYParser.parse(arrayBuffer);

                    console.log("NPY parsed:", {
                        shape: npyData.shape,
                        isComplex: npyData.isComplex,
                    });

                    const N = npyData.real.length;

                    // Try to load signal info
                    let signalInfo = null;
                    const signalInfoFilename = filename.replace(
                        "samples.npy",
                        "signal_info.data.json",
                    );

                    try {
                        // Try to load signal info from the same location as the samples file
                        if (isURL) {
                            const basePath = fileOrPath.substring(
                                0,
                                fileOrPath.lastIndexOf("/") + 1,
                            );
                            const signalInfoURL = basePath + signalInfoFilename;
                            const response = await fetch(signalInfoURL);
                            if (response.ok) {
                                signalInfo = await response.json();
                                console.log("Signal info loaded from URL");
                            }
                        } else {
                            // For browser context, we can't auto-load local files
                            const response = await fetch(
                                signalInfoFilename,
                            ).catch(() => null);
                            if (response && response.ok) {
                                signalInfo = await response.json();
                                console.log("Signal info loaded");
                            }
                        }
                    } catch (e) {
                        console.log("Signal info not available:", e.message);
                    }

                    // Compute FFT
                    console.log("Computing FFT...");
                    const t0 = performance.now();
                    const fftResult = computeFFT(npyData.real, npyData.imag);
                    const t1 = performance.now();
                    console.log(`FFT computed in ${(t1 - t0).toFixed(2)} ms`);

                    // Compute magnitude in dBFS
                    const mag_dB = new Float32Array(N);
                    for (let k = 0; k < N; k++) {
                        const magnitude =
                            Math.sqrt(
                                fftResult.real[k] ** 2 + fftResult.imag[k] ** 2,
                            ) / N;
                        mag_dB[k] = 20 * Math.log10(magnitude / 32768 + 1e-10);
                    }

                    // Frequency axis with decimation
                    const fs = parseFloat(sampleRateInput.value) * 1e6; // Convert MHz to Hz
                    const decimation = parseFloat(decimationInput.value);
                    const effectiveFs = fs / decimation;

                    const freqs = new Float32Array(N);
                    for (let k = 0; k < N; k++) {
                        if (k < N / 2) {
                            freqs[k] = k * (effectiveFs / N);
                        } else {
                            freqs[k] = (k - N) * (effectiveFs / N);
                        }
                    }

                    // Apply fftshift
                    const half = Math.floor(N / 2);
                    const x = [
                        ...Array.from(freqs.slice(half)),
                        ...Array.from(freqs.slice(0, half)),
                    ];
                    const y = [...mag_dB.slice(half), ...mag_dB.slice(0, half)];

                    window.plotData = {
                        x,
                        y,
                        N,
                        signalInfo,
                        fs: effectiveFs,
                        filename: filename,
                        mag_dB,
                        rawReal: npyData.real,
                        rawImag: npyData.imag,
                        isComplex: npyData.isComplex,
                    };

                    // Reset view to FFT
                    window.currentView = "fft";
                    viewToggle.textContent = "View Samples";
                    viewToggle.classList.remove("active");

                    updatePlot();
                    updateSidebar();
                } catch (err) {
                    console.error("Error processing file:", err);
                    document.getElementById("sidebar-content").innerHTML =
                        `<div class="error"><strong>Error:</strong> ${err.message}</div>`;

                Plotly.newPlot("plot", traces, layout, {
                    responsive: true,
                    scrollZoom: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ["lasso2d", "select2d"],
                    displaylogo: false,
                });
            }
        </script>
